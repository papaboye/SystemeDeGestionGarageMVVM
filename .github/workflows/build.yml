name: Build

on:
  push:
    branches:
      - master
      - portfolio-cleanup
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TravailPratique2.csproj

      - name: Build
        run: dotnet build TravailPratique2.csproj --configuration Release --no-restore /p:ContinuousIntegrationBuild=true
